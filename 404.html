<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Page Not Found - FinScheme</title>
  <link rel="stylesheet" href="css/theme.css">
  <script src="js/theme.js"></script>
</head>
<body class="aurora-bg grid-pattern" style="min-height: 100vh; overflow: hidden;">
  <main style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">
    <div class="glass spotlight-card fade-in" style="padding: 5rem 3rem; max-width: 700px; text-align: center; border-radius: var(--radius-lg); position: relative;">
      
      <!-- Floating Icon -->
      <div style="position: absolute; top: -40px; left: 50%; transform: translateX(-50%); background: white; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-lg); border: 1px solid var(--border);">
        <i data-lucide="shield-alert" style="width: 40px; height: 40px; color: var(--danger);"></i>
      </div>

      <h1 class="shiny-text" style="font-size: 8rem; font-weight: 900; line-height: 1; margin-bottom: 1rem; letter-spacing: -0.05em;">404</h1>
      <h2 style="font-size: 2rem; font-weight: 800; margin-bottom: 1.5rem; color: var(--dark);">This page is off the grid.</h2>
      <p style="margin-bottom: 3rem; color: var(--text-muted); font-size: 1.125rem; max-width: 500px; margin-left: auto; margin-right: auto;">
        The government scheme or resource you're looking for might have moved or the link is outdated. Let's find what you need.
      </p>

      <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="index.html" class="btn btn-primary btn-shimmer" style="padding: 1rem 2rem; font-size: 1.1rem; border-radius: 12px;">
          <i data-lucide="home"></i> Back to Homepage
        </a>
        <button onclick="window.history.back()" class="btn btn-outline" style="padding: 1rem 2rem; font-size: 1.1rem; border-radius: 12px; background: white;">
          <i data-lucide="arrow-left"></i> Go Back
        </button>
      </div>

      <!-- Background Highlight -->
      <div style="position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(16, 185, 129, 0.05), transparent 70%); z-index: -1;"></div>
    </div>
  </main>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
    
    // Additional search feature on 404 (optional but premium)
    document.addEventListener('DOMContentLoaded', () => {
        if(window.refreshInteractions) window.refreshInteractions();
    });
  </script>
</body>
</html>
